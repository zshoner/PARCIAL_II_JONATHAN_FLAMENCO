<h2>Mod Reportes</h2>

<ul>
  @for (item of lista; track $index) {
    <li>ID {{ $index }}: {{ item }}</li>
  }
</ul>



<hr>
<br>
<h3>Modificar Registro</h3>
<div>
  <h3> Ingresa el ID del registro</h3>
  <input type="number" [(ngModel)]="id" placeholder="Indice">
  <br>
  <input type="text" [(ngModel)]="nuevoTexto" placeholder="Nuevo proceso">
  <br>

  <button type="button" (click)="modificar()">Modificar</button>
</div>
